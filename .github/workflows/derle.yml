name: Android Studio Olmadan APK Derle
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. En güncel Node 24 uyumlu kod çekme motoru
    - uses: actions/checkout@v5

    # 2. En güncel Node 24 uyumlu resmi Java eklentisi
    - name: Java 17 Kur
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Hata veren @v4 yerine tamamen güncel @v4.3.0+ (veya doğrudan güncel motor) kullanımı
    - name: Resmi Gradle Motorunu Kur ve Derle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11'
        cache-disabled: true # Cache uyuşmazlığı hatalarını kökten engeller

    # 4. Doğrudan APK paketleme komutu
    - name: APK Derle
      run: gradle assembleDebug

    # 5. Çıkan APK dosyasını indirme paneline teslim eder
    - name: APK'yi Teslim Et
      uses: actions/upload-artifact@v4
      with:
        name: Uygulamam-APK
        path: app/build/outputs/apk/debug/app-debug.apk
