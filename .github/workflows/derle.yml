name: Android Studio Olmadan APK Derle
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Node 24 destekli en güncel kod çekme eklentisi (v4 tamamen kaldırıldı)
    - uses: actions/checkout@v5

    # 2. Node 24 ile tam uyumlu resmi Java eklentisi
    - name: Java 17 Kur
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Sürükle-bırak hatalarını önleyen tamamen güncel Gradle eklentisi
    - name: Resmi Gradle Motorunu Kur ve Derle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11'

    # 4. Projeyi APK olarak derleme komutu
    - name: APK Derle
      run: gradle assembleDebug

    # 5. Üretilen APK'yı indirme paneline teslim eder
    - name: APK'yi Teslim Et
      uses: actions/upload-artifact@v4
      with:
        name: Uygulamam-APK
        path: app/build/outputs/apk/debug/app-debug.apk
