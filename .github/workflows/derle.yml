name: Android Studio Olmadan APK Derle
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Node 24 destekli en güncel kod çekme eklentisi (v4 tamamen kaldırıldı)
    - uses: actions/checkout@v5

    # Node 24 ile tam uyumlu en yeni Java eklentisi (v4 tamamen kaldırıldı)
    - name: Java 17 Kur
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # Sürükle-bırak yaparken eksik kalabilen gerekli derleme araçlarını kurar
    - name: Gradle Yapısını Tamamla
      run: |
        curl -sL https://gradle.org -o gradle.zip
        unzip -q gradle.zip
        export PATH=$PWD/gradle-8.7/bin:$PATH
        gradle wrapper --gradle-version 8.7

    - name: Gradle Calistirma Izni Ver
      run: chmod +x gradlew

    # Projeyi hatasız bir şekilde APK olarak paketler
    - name: Projeyi APK Olarak Derle
      run: ./gradlew assembleDebug

    # Hazır APK dosyasını indirme paneline iletir
    - name: APK'yi Teslim Et
      uses: actions/upload-artifact@v4
      with:
        name: Uygulamam-APK
        path: app/build/outputs/apk/debug/app-debug.apk
