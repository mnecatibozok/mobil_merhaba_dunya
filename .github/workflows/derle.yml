name: Android Studio Olmadan APK Derle
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Node 24 uyumlu en güncel kod çekme eklentisi (v4 yerine v4.2.0+)
    - uses: actions/checkout@v4.2.1

    # Node 24 uyumlu en güncel Java eklentisi
    - name: Java 17 Kur
      uses: actions/setup-java@v4.2.2
      with:
        distribution: 'temurin'
        java-version: '17'

    # Eksik olan gradlew (Gradle Wrapper) araçlarını bulutta sıfırdan oluşturur
    - name: Gradle Sistemini Kur
      run: |
        curl -sL https://gradle.org -o gradle.zip
        unzip -q gradle.zip
        export PATH=$PWD/gradle-8.7/bin:$PATH
        gradle wrapper --gradle-version 8.7

    # Derleyiciye çalıştırma izni verir
    - name: Gradle Izni Ver
      run: chmod +x gradlew

    # Android uygulamasını sıfır hata ile derler
    - name: APK Derle
      run: ./gradlew assembleDebug

    # Üretilen APK dosyasını indirme paneline ekler
    - name: APK'yi Teslim Et
      uses: actions/upload-artifact@v4
      with:
        name: Uygulamam-APK
        path: app/build/outputs/apk/debug/app-debug.apk
