name: Android Studio Olmadan APK Derle
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Kodları çeken en güncel resmi v5 eklentisi (Node 24 uyumlu)
    - uses: actions/checkout@v5

    # 2. Resmi Java v5 eklentisi (Node 24 uyumlu)
    - name: Java 17 Kur
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Üçüncü parti eklenti kullanmadan, Linux sistemine Gradle'ı doğrudan kuruyoruz
    - name: Sistem Seviyesinde Gradle Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle

    # 4. Uygulamayı doğrudan yerleşik sistem aracıyla APK olarak paketliyoruz
    - name: APK Derle
      run: gradle assembleDebug

    # 5. Üretilen hazır APK dosyasını indirme paneline teslim ediyoruz
    - name: APK'yi Teslim Et
      uses: actions/upload-artifact@v4
      with:
        name: Uygulamam-APK
        path: app/build/outputs/apk/debug/app-debug.apk
