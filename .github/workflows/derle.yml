name: Android Studio Olmadan APK Derle
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Node 24 tabanlı en güncel resmi eklentiler (Node 20 bağımlılığı sıfırlandı)
    - uses: actions/checkout@v4.3.0

    - name: Java 17 Kur
      uses: actions/setup-java@v4.3.0
      with:
        distribution: 'temurin'
        java-version: '17'

    # Sürükle-bırak yöntemiyle eksik kalabilen temel Android Wrapper dosyalarını indirir
    - name: Gradle Yapısını Tamamla
      run: |
        curl -sL https://gradle.org -o gradle.zip
        unzip -q gradle.zip
        export PATH=$PWD/gradle-8.7/bin:$PATH
        gradle wrapper --gradle-version 8.7

    - name: Gradle Calistirma Izni Ver
      run: chmod +x gradlew

    # Android uygulamasını sıfırdan temiz bir şekilde APK haline getirir
    - name: Projeyi APK Olarak Derle
      run: ./gradlew assembleDebug

    # Çıkan hazır APK dosyasını panelde indirilebilir duruma getirir
    - name: APK'yi Teslim Et
      uses: actions/upload-artifact@v4
      with:
        name: Uygulamam-APK
        path: app/build/outputs/apk/debug/app-debug.apk
