name: Android Studio Olmadan APK Derle
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Depodaki kodları çekiyoruz
    - uses: actions/checkout@v4

    # En güncel Java kurulumunu yapıyoruz
    - name: Java 17 Kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Gradle sistemine çalıştırma izni veriyoruz
    - name: Gradle Izni Ver
      run: chmod +x gradlew

    # Android uygulamasını doğrudan derliyoruz
    - name: APK Derle
      run: ./gradlew assembleDebug

    # Üretilen APK dosyasını indirilebilir hale getiriyoruz
    - name: APK'yi Teslim Et
      uses: actions/upload-artifact@v4
      with:
        name: Uygulamam-APK
        path: app/build/outputs/apk/debug/app-debug.apk

