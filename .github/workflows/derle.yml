name: Android Studio Olmadan APK Derle
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Kodları Node 24 uyumlu resmi eklentiyle çekiyoruz
    - uses: actions/checkout@v4

    # 2. Resmi Java eklentisini kuruyoruz
    - name: Java 17 Kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Projenizde hiçbir Gradle dosyası olmasa bile otomatik tamamlama yapan resmi eklenti
    - name: Resmi Gradle Motorunu Kur ve Derle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7' # Sürükle bırak hatalarını tamamen bypass eder

    # 4. Doğrudan APK derleme komutunu çalıştırıyoruz
    - name: APK Derle
      run: gradle assembleDebug

    # 5. Çıkan APK dosyasını sisteme yüklüyoruz
    - name: APK'yi Teslim Et
      uses: actions/upload-artifact@v4
      with:
        name: Uygulamam-APK
        path: app/build/outputs/apk/debug/app-debug.apk
