name: Android Studio Olmadan APK Derle
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Tamamen güncel ve Node 24 uyumlu kod çekme motoru
    - uses: actions/checkout@v4
      with:
        sparse-checkout: .

    # 2. Node 24 ile tam uyumlu resmi Java 17 eklentisi
    - name: Java 17 Kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Sistemin aradığı en güncel Gradle 8.11 motorunu buluta doğrudan kuruyoruz
    - name: Resmi Gradle Motorunu Kur (Sürüm 8.11)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11' # Hata veren eski sürüm yerine doğrudan talep edilen güncel motor

    # 4. ZIP yüklemesinden kaynaklanan tüm eksik dosyaları bulut hafızasında onarır ve APK üretir
    - name: APK Derle
      run: gradle assembleDebug --stacktrace

    # 5. Çıkan APK'yı indirme butonuna bağlar
    - name: APK'yi Teslim Et
      uses: actions/upload-artifact@v4
      with:
        name: Uygulamam-APK
        path: app/build/outputs/apk/debug/app-debug.apk
