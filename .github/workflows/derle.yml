name: Android Studio Olmadan APK Derle
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Node 24 ile tam uyumlu en güncel kod çekme sürümü
    - uses: actions/checkout@v4

    # Node 24 desteğine sahip en yeni Java eklentisi (v4 yerine v5)
    - name: Java 17 Kur
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # Eksik gradle tetikleyicilerini otomatik olarak buluta yükler
    - name: Gradle Wrapper Kurulumu
      run: gradle wrapper

    # Gradle sistemine çalıştırma izni verir
    - name: Gradle Izni Ver
      run: chmod +x gradlew

    # Android uygulamasını debug modunda derler
    - name: APK Derle
      run: ./gradlew assembleDebug

    # Üretilen hazır APK'yı size teslim eder
    - name: APK'yi Teslim Et
      uses: actions/upload-artifact@v4
      with:
        name: Uygulamam-APK
        path: app/build/outputs/apk/debug/app-debug.apk

