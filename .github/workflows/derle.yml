name: Android Studio Olmadan APK Derle
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Node 24 uyumlu en güncel kod çekme motoru
    - uses: actions/checkout@v4.2.2

    # 2. Uyarıda talep edilen, Node 24 ile tam uyumlu resmi Java 17 eklentisi
    - name: Java 17 Kur
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Web yüklemelerindeki eksik altyapıyı tamamlayan güncel Gradle eklentisi
    - name: Resmi Gradle Motorunu Kur
      uses: gradle/actions/setup-gradle@v4.3.0
      with:
        gradle-version: '8.11' # En kararlı ve güncel sürüm

    # 4. Uygulamayı doğrudan APK olarak paketler
    - name: APK Derle
      run: gradle assembleDebug

    # 5. Üretilen hazır APK'yı indirme butonuna teslim eder
    - name: APK'yi Teslim Et
      uses: actions/upload-artifact@v4
      with:
        name: Uygulamam-APK
        path: app/build/outputs/apk/debug/app-debug.apk
